name: NTIS 공고 수집

on:
  schedule:
    # 시간은 세계 표준시(UTC) 기준. 한국 시간으로는 평일 오전 7:17, 낮 12:17, 오후 5:17
    - cron: '17 22 * * 0-4'
    - cron: '17 3,8 * * 1-5'
  workflow_dispatch:   # Actions 화면에서 'Run workflow' 버튼으로 바로 실행 가능
  push:                # 수집 프로그램이나 이 설정을 고쳐 올리면 한 번 바로 실행
    branches: [main]
    paths: ['crawler.py', '.github/workflows/crawling.yml']

concurrency:
  group: ntis-crawl
  cancel-in-progress: false

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 도구 설치
        run: pip install requests

      - name: NTIS 공고 수집
        run: python crawler.py

      - name: 결과 저장 (실패해도 meta.json은 저장)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json meta.json
          git diff --cached --quiet && exit 0
          git commit -m "NTIS 공고 자동 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
